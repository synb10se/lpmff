      - heading "Fahrzeugzustand" [level=2] [ref=e48]
      - paragraph [ref=e49]: Das Herzsymbol oben rechts öffnet den Fahrzeugzustand, momentan nur mit dem Reifendruck aller vier Räder (kPa und bar).
