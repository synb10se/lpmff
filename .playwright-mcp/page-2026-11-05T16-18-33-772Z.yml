      - heading "Fahrzeugstandort" [level=2] [ref=e53]
      - paragraph [ref=e54]: Die Karte zeigt die Position des Fahrzeugs, die Entfernung dorthin und eine Navigationstaste. Mit „Hupen“ lässt sich das Fahrzeug akustisch orten. Die Standortfreigabe der App muss dafür aktiv sein.
